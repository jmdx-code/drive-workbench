name: Release portable apps
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing published release tag, for example v1.3.3'
        required: true
        type: string
      publish:
        description: 'Upload to this published release after all builds pass (false = build/test only)'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Windows-x64
            os: windows-2025
          - target: macOS-arm64
            os: macos-15
          - target: macOS-x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      BUILD_ONLY: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish && github.sha || env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Verify release version
        run: node scripts/verify-release-tag.mjs
      - run: npm ci
      - run: npm test
      - run: npm run package
      - name: Launch packaged application
        run: node scripts/portable-smoke.mjs
      - name: Windows business regression
        if: runner.os == 'Windows'
        run: node scripts/ci-windows-ui.mjs
      - name: macOS packaged updater preparation
        if: runner.os == 'macOS'
        run: node scripts/update-asar-ui-test.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.target }}
          path: |
            release/*.zip
            release/SHA256SUMS-*.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Preserve diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.target }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  publish:
    if: github.event_name == 'release' || inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    environment: release-signing
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: node scripts/verify-release-tag.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true
      - name: Sign the exact packages after all builds pass
        env:
          WB_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$WB_UPDATE_SIGNING_PRIVATE_KEY" || { echo 'Configure UPDATE_SIGNING_PRIVATE_KEY in release-signing Environment'; exit 1; }
          node scripts/sign-release.mjs packages
      - name: Verify packages and publish signed release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: packages
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 3
          sha256sum --check SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" ./*.zip SHA256SUMS.txt UPDATE-MANIFEST.json UPDATE-MANIFEST.sig --clobber
